name: Public evidence integrity

on:
  pull_request:
    branches: [develop, feature/e0-existing-evidence]
    paths:
      - 'docs/evidence/**'
      - 'docs/research/pr64-evidence-hpc-baseline.md'
      - 'docs/research/pr65-computational-ledger.md'
      - 'docs/research/computational-reconciliation-and-thread-pilot.md'
      - 'docs/research/mvp2-hpc-roadmap.md'
      - 'scripts/slurm/dasci/*pr65*'
      - 'scripts/slurm/dasci/*pr66*'
      - 'scripts/slurm/dasci/submit_paired_matrix.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v2.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v3.sbs'
      - 'scripts/slurm/dasci/submit_pr78_medium.sbs'
      - 'docs/research/pr66-reconciliation-thread-pilot.md'
      - 'docs/research/pr66-dasci-runbook.md'
      - 'configs/experiments/pr66_thread_screen_v1.json'
      - 'scripts/evidence/**'
      - 'src/cfl_gnn/**'
      - 'tests/evidence/**'
      - 'configs/experiments/mvp2_gpu_comparison_v1.json'
      - 'configs/experiments/pr87_matched_gpu_v1.json'
      - 'tests/smoke/test_pr87_matched_gpu.py'
      - 'configs/quality/pr64-ruff.toml'
      - '.github/workflows/evidence.yml'
      - 'tests/smoke/test_pr94_features.py'
      - '.gitattributes'
  push:
    branches: [develop]
    paths:
      - 'docs/evidence/**'
      - 'scripts/evidence/**'
      - 'src/cfl_gnn/**'
      - 'scripts/slurm/dasci/*pr65*'
      - 'scripts/slurm/dasci/*pr66*'
      - 'scripts/slurm/dasci/submit_paired_matrix.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v2.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v3.sbs'
      - 'scripts/slurm/dasci/submit_pr78_medium.sbs'
      - 'docs/research/pr66-reconciliation-thread-pilot.md'
      - 'docs/research/pr66-dasci-runbook.md'
      - 'configs/experiments/pr66_thread_screen_v1.json'
      - 'docs/research/pr65-computational-ledger.md'
      - 'docs/research/computational-reconciliation-and-thread-pilot.md'
      - 'docs/research/mvp2-hpc-roadmap.md'
      - 'tests/evidence/**'
      - 'configs/experiments/mvp2_gpu_comparison_v1.json'
      - 'configs/experiments/pr87_matched_gpu_v1.json'
      - 'tests/smoke/test_pr87_matched_gpu.py'
      - 'configs/quality/pr64-ruff.toml'
      - '.github/workflows/evidence.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/evidence.yml
      - name: Install pinned offline test dependencies
        run: python -m pip install ruff==0.16.8 numpy==1.26.4
      - name: Scoped lint
        run: python -m ruff check --config configs/quality/pr64-ruff.toml scripts/evidence tests/evidence
      - name: Scoped format
        run: python -m ruff format --check --config configs/quality/pr64-ruff.toml scripts/evidence tests/evidence
      - name: Check medium operator shell syntax without execution
        shell: bash
        run: |
          bash -n scripts/evidence/operate_pr78_medium.sh
          bash -n scripts/slurm/dasci/submit_pr78_medium.sbs
          bash -n scripts/evidence/operate_pr80_numeric.sh
          bash -n scripts/evidence/operate_pr80_integrated.sh
          bash -n scripts/evidence/operate_e0_inference.sh
          bash -n scripts/evidence/operate_e0_solves.sh
          bash -n scripts/evidence/operate_pr86_binding.sh
          bash -n scripts/evidence/operate_pr86_roots.sh
          bash -n scripts/evidence/operate_pr86_guidance.sh
          bash -n scripts/evidence/operate_pr86_main_first.sh
          bash -n scripts/evidence/operate_pr86_six_jobs.sh
          bash -n scripts/evidence/operate_pr86_f3_jobs.sh
          bash -n scripts/evidence/operate_pr86_next_wave.sh
          bash -n scripts/evidence/operate_pr86_wave19.sh
          bash -n scripts/evidence/operate_pr86_wave25.sh
          bash -n scripts/evidence/operate_pr86_wave31.sh
          bash -n scripts/evidence/operate_pr86_wave37.sh
          bash -n scripts/evidence/operate_pr86_wave43.sh
          bash -n scripts/evidence/operate_pr86_wave49.sh
          bash -n scripts/evidence/operate_pr86_wave55.sh
          bash -n scripts/evidence/operate_pr86_wave61.sh
          bash -n scripts/evidence/operate_pr86_wave67.sh
          bash -n scripts/evidence/operate_pr87_training.sh
          bash -n scripts/evidence/operate_pr94_preparation.sh
          bash -n scripts/evidence/install_pr94_preparation.template.sh
          bash -n scripts/evidence/operate_pr94_evaluation.sh
          bash -n scripts/evidence/install_pr94_evaluation.template.sh
          bash -n docs/research/solver-seed-extension-v2/recovery-launch.template.sh
      - name: T1 PR94 installation, preparation and evaluation admission (no scientific calls)
        run: python -B -m unittest discover -s tests/evidence -p "test_pr94*.py" -v
      - name: T3 evidence regression (single discovery, no solver or training)
        shell: bash
        run: python -B -m unittest discover -s tests/evidence -v 2>&1 | tee evidence-tests.log
      - name: Preserve test identities, failures and elapsed time
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: evidence-tests.log
          if-no-files-found: ignore
          retention-days: 14

  matched-step:
    # Tensor/collective semantics absent from the stdlib/numpy evidence matrix.
    # No GPU, real dataset, solver or scientific training. Not a duplicated T3.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/workflows/evidence.yml
      - name: Install isolated CPU-only tensor test dependencies
        run: |
          python -m pip install numpy==1.26.4 ruff==0.16.8
          python -m pip install torch==2.1.2+cpu --index-url https://download.pytorch.org/whl/cpu
          # models/__init__.py imports Liang as well as Gasse; use the HPC PyG version.
          python -m pip install torch-geometric==2.7.0
          # ETL imports used by the production encoder parity fixture; CI only.
          python -m pip install pandas==2.3.3 pyarrow==21.0.0 tqdm==4.67.1
      - name: PR87 source and tensor test style
        run: |
          python -m ruff check --config configs/quality/pr64-ruff.toml src/cfl_gnn/training/matched_gpu.py tests/smoke/test_pr87_matched_gpu.py
          python -m ruff format --check --config configs/quality/pr64-ruff.toml src/cfl_gnn/training/matched_gpu.py tests/smoke/test_pr87_matched_gpu.py
      - name: PR94 tensor fixture style
        run: |
          python -m ruff check --config configs/quality/pr64-ruff.toml tests/smoke/test_pr94_features.py
          python -m ruff format --check --config configs/quality/pr64-ruff.toml tests/smoke/test_pr94_features.py
      - name: PR94 label-free feature parity and serialization (synthetic CPU only)
        run: python -B -m unittest discover -s tests/smoke -p test_pr94_features.py -v
      - name: T2 actual gradient averaging and unequal-size graph checks
        run: python -B -m unittest discover -s tests/smoke -p test_pr87_matched_gpu.py -v
