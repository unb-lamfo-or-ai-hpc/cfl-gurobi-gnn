project:
  type: manuscript
  output-dir: _manuscript
  render: [index.qmd]
  resources:
    - LICENSE
    - evidence-status.json
    - results/current/**
    - figures/**
    - tables/**
    - highlights.txt
manuscript:
  article: index.qmd
  notebooks: []
  code-links:
    - text: Source repository
      icon: github
      href: https://github.com/unb-lamfo-or-ai-hpc/cfl-gurobi-gnn
    - text: Article (PDF)
      href: https://unb-lamfo-or-ai-hpc.github.io/cfl-gurobi-gnn/index.pdf
    - text: Appendices (HTML)
      href: https://unb-lamfo-or-ai-hpc.github.io/cfl-gurobi-gnn/appendices/index.html
    - text: Appendices (PDF)
      href: https://unb-lamfo-or-ai-hpc.github.io/cfl-gurobi-gnn/appendices/appendices.pdf
    - text: Editable LaTeX project (ZIP)
      href: https://unb-lamfo-or-ai-hpc.github.io/cfl-gurobi-gnn/cfl-cor-latex-project.zip
    - text: Article TeX (dependencies in ZIP)
      href: https://unb-lamfo-or-ai-hpc.github.io/cfl-gurobi-gnn/index.tex
    - text: Appendices TeX (dependencies in ZIP)
      href: https://unb-lamfo-or-ai-hpc.github.io/cfl-gurobi-gnn/appendices/appendices.tex
    - text: Preservation plan (GitHub/Zenodo)
      href: https://github.com/unb-lamfo-or-ai-hpc/cfl-gurobi-gnn/blob/main/docs/research/mvp2-data-release-plan.md
  meca-bundle: false
execute:
  enabled: false
  freeze: true
lang: en
license: MIT
bibliography: references.bib
format:
  html:
    theme: cosmo
    toc: true
    number-sections: true
    include-after-body:
      text: |
        <nav aria-label="Research materials" class="border-top mt-4 pt-3 small">
          <p>Research materials:
            <a href="index.pdf">Article PDF</a> ·
            <a href="appendices/appendices.pdf">Appendices PDF</a> ·
            <a href="https://github.com/unb-lamfo-or-ai-hpc/cfl-gurobi-gnn/blob/main/docs/research/mvp2-data-release-plan.md">Preservation plan (GitHub/Zenodo)</a>
          </p>
        </nav>
  pdf:
    template: _extensions/elsevier/template.tex
    cite-method: natbib
    biblio-style: elsarticle-harv
    pdf-engine: pdflatex
    keep-tex: true
    number-sections: true
    fig-pos: htbp
website:
  site-url: https://unb-lamfo-or-ai-hpc.github.io/cfl-gurobi-gnn/
  description: Evaluating conditional optimization effects and computational costs of GNN-based partial warm starts for CFL.
