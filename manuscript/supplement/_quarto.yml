project:
  type: default
  output-dir: ../_manuscript/appendices
  render: [index.qmd]
execute:
  enabled: false
  freeze: true
lang: en
bibliography: ../references.bib
format:
  html:
    toc: true
    number-sections: false
    code-fold: true
  pdf:
    output-file: appendices.pdf
    toc: true
    toc-depth: 1
    documentclass: article
    papersize: a4
    fontsize: 11pt
    geometry: margin=24mm
    pdf-engine: pdflatex
    cite-method: natbib
    biblio-style: ../elsarticle-harv
    keep-tex: true
    number-sections: false
    fig-pos: htbp
    include-in-header:
      text: |
        \usepackage{longtable,booktabs,array,amsmath,amssymb}
        \newcommand{\AppendixDisplayNumbers}[1]{%
          \setcounter{table}{0}\setcounter{figure}{0}%
          \renewcommand{\thetable}{#1.\arabic{table}}%
          \renewcommand{\thefigure}{#1.\arabic{figure}}%
          \renewcommand{\theHtable}{#1.\arabic{table}}%
          \renewcommand{\theHfigure}{#1.\arabic{figure}}%
        }
