name: Public evidence integrity

on:
  pull_request:
    branches: [develop, feature/e0-existing-evidence]
    paths:
      - 'docs/evidence/**'
      - 'docs/research/pr64-evidence-hpc-baseline.md'
      - 'docs/research/pr65-computational-ledger.md'
      - 'docs/research/computational-reconciliation-and-thread-pilot.md'
      - 'docs/research/mvp2-hpc-roadmap.md'
      - 'scripts/slurm/dasci/*pr65*'
      - 'scripts/slurm/dasci/*pr66*'
      - 'scripts/slurm/dasci/submit_paired_matrix.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v2.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v3.sbs'
      - 'scripts/slurm/dasci/submit_pr78_medium.sbs'
      - 'docs/research/pr66-reconciliation-thread-pilot.md'
      - 'docs/research/pr66-dasci-runbook.md'
      - 'configs/experiments/pr66_thread_screen_v1.json'
      - 'scripts/evidence/**'
      - 'src/cfl_gnn/**'
      - 'tests/evidence/**'
      - 'configs/experiments/mvp2_gpu_comparison_v1.json'
      - 'configs/quality/pr64-ruff.toml'
      - '.github/workflows/evidence.yml'
      - '.gitattributes'
  push:
    branches: [develop]
    paths:
      - 'docs/evidence/**'
      - 'scripts/evidence/**'
      - 'src/cfl_gnn/**'
      - 'scripts/slurm/dasci/*pr65*'
      - 'scripts/slurm/dasci/*pr66*'
      - 'scripts/slurm/dasci/submit_paired_matrix.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v2.sbs'
      - 'scripts/slurm/dasci/submit_paired_matrix_v3.sbs'
      - 'scripts/slurm/dasci/submit_pr78_medium.sbs'
      - 'docs/research/pr66-reconciliation-thread-pilot.md'
      - 'docs/research/pr66-dasci-runbook.md'
      - 'configs/experiments/pr66_thread_screen_v1.json'
      - 'docs/research/pr65-computational-ledger.md'
      - 'docs/research/computational-reconciliation-and-thread-pilot.md'
      - 'docs/research/mvp2-hpc-roadmap.md'
      - 'tests/evidence/**'
      - 'configs/experiments/mvp2_gpu_comparison_v1.json'
      - 'configs/quality/pr64-ruff.toml'
      - '.github/workflows/evidence.yml'
      - '.gitattributes'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/workflows/evidence.yml
      - name: Install pinned offline test dependencies
        run: python -m pip install ruff==0.16.8 numpy==1.26.4
      - name: Scoped lint
        run: python -m ruff check --config configs/quality/pr64-ruff.toml scripts/evidence tests/evidence
      - name: Scoped format
        run: python -m ruff format --check --config configs/quality/pr64-ruff.toml scripts/evidence tests/evidence
      - name: Check medium operator shell syntax without execution
        shell: bash
        run: |
          bash -n scripts/evidence/operate_pr78_medium.sh
          bash -n scripts/slurm/dasci/submit_pr78_medium.sbs
          bash -n scripts/evidence/operate_pr80_numeric.sh
          bash -n scripts/evidence/operate_pr80_integrated.sh
          bash -n scripts/evidence/operate_e0_inference.sh
          bash -n scripts/evidence/operate_e0_solves.sh
          bash -n scripts/evidence/operate_pr86_binding.sh
          bash -n scripts/evidence/operate_pr86_roots.sh
          bash -n scripts/evidence/operate_pr86_guidance.sh
          bash -n scripts/evidence/operate_pr86_main_first.sh
      - name: T3 evidence regression (single discovery, no solver or training)
        shell: bash
        run: python -B -m unittest discover -s tests/evidence -v 2>&1 | tee evidence-tests.log
      - name: Preserve test identities, failures and elapsed time
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: evidence-tests.log
          if-no-files-found: ignore
          retention-days: 14
