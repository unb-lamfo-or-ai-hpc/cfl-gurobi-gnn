project:
  type: default
  output-dir: ../_manuscript/supplement
  render: [index.qmd]
execute:
  enabled: false
  freeze: true
lang: en
bibliography: ../references.bib
format:
  html:
    toc: true
    number-sections: false
    code-fold: true
  pdf:
    documentclass: article
    papersize: a4
    fontsize: 11pt
    geometry: margin=24mm
    pdf-engine: pdflatex
    cite-method: natbib
    biblio-style: ../elsarticle-harv
    keep-tex: true
    number-sections: false
    fig-pos: htbp
    include-in-header:
      text: |
        \usepackage{longtable,booktabs,array,amsmath,amssymb}
